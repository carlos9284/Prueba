name: Build HUN Urgencias APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HUNUrgencias/**'
      - '.github/workflows/build-hun-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aviso-hun-debug-keystore-v2

      - name: Create debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Aviso HUN, OU=Android, O=Aviso HUN, L=Pamplona, C=ES"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: HUNUrgencias
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HUNUrgencias-debug-apk
          path: HUNUrgencias/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
